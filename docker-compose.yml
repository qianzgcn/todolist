# Docker Compose 部署配置 (连接外部已有 MySQL)
services:
  todolist:
    build: .
    container_name: todolist-app
    restart: always
    # 默认将目标服务器的 80 端口映射到容器内的 8001 端口
    ports:
      - "80:8001"
    environment:
      - PORT=8001
      # 替换为你目标服务器上已有的 MySQL 连接信息
      - DATABASE_URL=mysql://root:password@host.docker.internal:3306/todolist
